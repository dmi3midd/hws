name: Audit
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6

      - name: Test
        run: go test -v -race ./...
